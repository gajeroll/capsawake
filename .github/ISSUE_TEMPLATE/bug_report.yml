name: Bug report
description: Report an issue or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security vulnerability, do not file a public issue. See
        [SECURITY.md](https://github.com/gajeroll/capsawake/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable CapsAwake
        2. Close the lid
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CapsAwake version
      description: Version from Settings window or git commit/tag.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and hardware model
      placeholder: macOS 15.3, MacBook Air M2
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Notarized release zip
        - Built from source
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: System log output
      description: |
        Run the command below, reproduce the issue, and paste output here:
      value: |
        <details>

        ```
        log stream --predicate 'subsystem == "com.gajeroll.capsawake"' --level debug
        ```

        </details>

  - type: checkboxes
    id: sleep-tools
    attributes:
      label: Conflicting tools or manual overrides
      description: CapsAwake may conflict with other sleep management utilities.
      options:
        - label: Other sleep prevention tools installed (e.g. Amphetamine, caffeinate, KeepingYouAwake)
        - label: Custom pmset settings modified manually
